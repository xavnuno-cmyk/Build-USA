<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Build USA">
  <meta name="description" content="Conversor de milímetros a pies y pulgadas en octavos para construcción.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Build USA</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0c0d;
      --panel: #171719;
      --panel-2: #202023;
      --text: #f6f3ea;
      --muted: #b9b4a8;
      --gold: #d5a62e;
      --gold-2: #f0c95f;
      --line: #343438;
      --danger: #e16b61;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #2c2618 0, transparent 37%),
        linear-gradient(180deg, #101011, #080809 78%);
      color: var(--text);
      padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: min(100%, 560px);
      margin: 0 auto;
    }
    .brand {
      display: block;
      width: min(100%, 420px);
      margin: 4px auto 22px;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.5));
    }
    .card {
      background: linear-gradient(180deg, rgba(31,31,34,.98), rgba(20,20,22,.98));
      border: 1px solid #3b3526;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.38);
    }
    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--muted);
      margin-bottom: 9px;
    }
    .input-wrap {
      position: relative;
    }
    input {
      width: 100%;
      border: 2px solid #685526;
      border-radius: 16px;
      padding: 18px 74px 18px 18px;
      background: #0f0f10;
      color: white;
      font-size: clamp(30px, 8vw, 46px);
      font-weight: 700;
      text-align: right;
      outline: none;
      appearance: textfield;
    }
    input:focus {
      border-color: var(--gold-2);
      box-shadow: 0 0 0 4px rgba(213,166,46,.14);
    }
    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button { display: none; }
    .unit {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-2);
      font-size: 18px;
      font-weight: 800;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #655426, transparent);
      margin: 22px 0;
    }
    .result-label {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    #result {
      min-height: 88px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: clamp(42px, 13vw, 72px);
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -.03em;
      color: #fff;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-top: 14px;
    }
    .status {
      margin-top: 16px;
      min-height: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .error { color: var(--danger); }
    footer {
      color: #7e7a70;
      text-align: center;
      font-size: 11px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="con-512.png" alt="Build USA">
    <section class="card" aria-label="Conversor de medidas">
      <label for="mm">Milímetros</label>
      <div class="input-wrap">
        <input id="mm" type="text" inputmode="decimal" autocomplete="off"
               placeholder="0" aria-describedby="help">
        <span class="unit">mm</span>
      </div>

      <div class="divider"></div>

      <div class="result-label">Resultado</div>
      <output id="result" for="mm">0' 0"</output>
      <p id="help" class="note">Redondeado al octavo de pulgada más cercano.</p>
      <div id="status" class="status" aria-live="polite"></div>
    </section>
    <footer>BUILD USA · MEASURE · CONVERT · BUILD</footer>
  </main>

<script>
(() => {
  "use strict";

  const input = document.getElementById("mm");
  const result = document.getElementById("result");
  const status = document.getElementById("status");

  const fractions = {
    0: "",
    1: "1/8",
    2: "1/4",
    3: "3/8",
    4: "1/2",
    5: "5/8",
    6: "3/4",
    7: "7/8"
  };

  function parseMillimetres(value) {
    const normalized = value.trim().replace(/\s/g, "").replace(",", ".");
    if (normalized === "") return null;
    if (!/^\d*\.?\d+$/.test(normalized)) return NaN;
    return Number(normalized);
  }

  function formatImperial(mm) {
    let totalEighths = Math.round((mm / 25.4) * 8);
    const feet = Math.floor(totalEighths / 96);
    totalEighths -= feet * 96;

    const wholeInches = Math.floor(totalEighths / 8);
    const eighths = totalEighths % 8;
    const fraction = fractions[eighths];

    const inchText = fraction
      ? `${wholeInches} ${fraction}"`
      : `${wholeInches}"`;

    return `${feet}' ${inchText}`;
  }

  function update() {
    const mm = parseMillimetres(input.value);

    if (mm === null) {
      result.textContent = `0' 0"`;
      status.textContent = "";
      status.className = "status";
      return;
    }

    if (!Number.isFinite(mm) || mm < 0) {
      result.textContent = "—";
      status.textContent = "Introduce un número válido.";
      status.className = "status error";
      return;
    }

    result.textContent = formatImperial(mm);
    status.textContent = "";
    status.className = "status";
  }

  input.addEventListener("input", update);
  input.addEventListener("focus", () => input.select());

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  update();
})();
</script>
</body>
</html>
